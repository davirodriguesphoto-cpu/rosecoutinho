      <rect data-r="f-quadril-d" data-nome="Quadril direito" x="56" y="214" width="36" height="48" rx="18"/>
      <rect data-r="f-quadril-e" data-nome="Quadril esquerdo" x="108" y="214" width="36" height="48" rx="18"/>
