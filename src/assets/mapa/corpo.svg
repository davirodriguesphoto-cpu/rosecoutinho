<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540" role="group" aria-label="Mapa do corpo: frente e costas">
  <!--
    EXEMPLO PROVISÓRIO. Para trocar pelo desenho final, substitua este arquivo.
    Regra: cada área clicável é um elemento com data-r (código único) e data-nome (nome que aparece na ficha).
    O resto do desenho (contorno, textos, traços) é livre.
  -->
  <defs>
    <g id="manequim">
      <circle cx="100" cy="28" r="22"/>
      <rect x="91" y="48" width="18" height="16" rx="7"/>
      <rect x="54" y="62" width="92" height="112" rx="38"/>
      <rect x="66" y="150" width="68" height="70" rx="26"/>
      <rect x="56" y="200" width="88" height="66" rx="30"/>
      <rect x="24" y="68" width="26" height="184" rx="13"/>
